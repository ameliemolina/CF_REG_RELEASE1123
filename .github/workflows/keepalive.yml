name: CF Reg Distribution (pull main repo)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "并发 job 数(每个 job = workers x count 个成功账号)"
        required: true
        default: "256"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "10"
          - "200"
          - "256"
      count:
        description: "每个 lane 的目标成功账号数"
        required: true
        default: "2"
        type: string
      workers:
        description: "每个 job 的并发 lane 数(每 lane 一个浏览器)"
        required: true
        default: "2"
        type: string
      proxy:
        description: "可选代理(host:port 或完整 URL)"
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  prep:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Build job index list
        id: gen
        shell: bash
        run: |
          n=${{ inputs.jobs }}
          arr=$(seq 1 "$n" | jq -R -s -c 'split("\n") | map(select(length>0)) | map(tonumber)')
          echo "matrix=$arr" >> "$GITHUB_OUTPUT"
          echo "jobs to run: $arr"

  register:
    name: "register batch ${{ matrix.idx }}"
    runs-on: windows-latest
    needs: prep
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        idx: ${{ fromJSON(needs.prep.outputs.matrix) }}

    steps:
      - name: Mask secrets
        shell: pwsh
        run: |
          Write-Host "::add-mask::cfm_d1060bb01c3597fa1dc69af14f5fb2a6832118ff2dd4036fc06bc1b36df291fd"
          Write-Host "::add-mask::${{ inputs.proxy }}"

      - name: Decode deploy key
        id: deploykey
        shell: bash
        run: |
          echo "key<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.MAIN_REPO_TOKEN }}" | base64 -d >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Pull private main repo
        uses: actions/checkout@v4
        with:
          repository: xbox-cn/CF_REG_RELEASE_V1
          ssh-key: ${{ steps.deploykey.outputs.key }}
          path: mainrepo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mainrepo/requirements.txt

      - name: Install deps
        shell: pwsh
        working-directory: mainrepo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install cloakbrowser
        shell: pwsh
        run: python -m cloakbrowser install

      - name: Register
        shell: pwsh
        working-directory: mainrepo
        env:
          CFREG_MANAGER_URL: "http://47.98.228.129:48713"
          CFREG_MANAGER_KEY: "cfm_d1060bb01c3597fa1dc69af14f5fb2a6832118ff2dd4036fc06bc1b36df291fd"
          INPUT_WORKERS: ${{ inputs.workers }}
          INPUT_COUNT: ${{ inputs.count }}
          INPUT_PROXY: ${{ inputs.proxy }}
        run: |
          $cliArgs = @(
            "-u", "batch_register.py",
            "--workers", $env:INPUT_WORKERS,
            "--count", $env:INPUT_COUNT,
            "--out-dir", "out_${{ matrix.idx }}"
          )
          if ($env:INPUT_PROXY) { $cliArgs += @("--proxy", $env:INPUT_PROXY) }
          Write-Host "args: $($cliArgs -join ' ')"
          python @cliArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect results
        if: always()
        shell: pwsh
        working-directory: mainrepo
        run: |
          $out = "out_${{ matrix.idx }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          $pairs = @(
            @("accounts.jsonl", "accounts_job_${{ matrix.idx }}.jsonl"),
            @("summary.json", "summary_job_${{ matrix.idx }}.json")
          )
          foreach ($p in $pairs) {
            $src = Join-Path $out $p[0]
            if (Test-Path $src) { Copy-Item $src $p[1] -Force }
            else { New-Item -ItemType File $p[1] -Force | Out-Null }
          }
          if (Test-Path (Join-Path $out "accounts.jsonl")) {
            $lines = (Get-Content (Join-Path $out "accounts.jsonl") | Measure-Object -Line).Lines
            Write-Host "accounts lines: $lines"
          }

      - name: Upload per-job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.idx }}
          retention-days: 1
          path: |
            mainrepo/accounts_job_${{ matrix.idx }}.jsonl
            mainrepo/summary_job_${{ matrix.idx }}.json
            mainrepo/out_${{ matrix.idx }}/outputs/error-*.png
          if-no-files-found: ignore

  merge:
    name: Merge results
    runs-on: ubuntu-latest
    needs: register
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: downloads
          pattern: result-*
          merge-multiple: true

      - name: Merge accounts
        shell: bash
        run: |
          set -euo pipefail
          cat downloads/accounts_job_*.jsonl > accounts-all.jsonl 2>/dev/null || : > accounts-all.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for line in Path("accounts-all.jsonl").read_text(encoding="utf-8").splitlines():
              if line.strip():
                  try:
                      rows.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass
          complete = [r for r in rows if r.get("state") == "complete"]
          uploaded = [r for r in complete if r.get("uploaded")]
          print(f"accounts: {len(rows)}")
          print(f"complete: {len(complete)}")
          print(f"uploaded: {len(uploaded)}")
          PY

      - name: Upload merged
        uses: actions/upload-artifact@v4
        with:
          name: accounts-all
          retention-days: 1
          path: accounts-all.jsonl
          if-no-files-found: ignore